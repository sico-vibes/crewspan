[package]
name = "crewspan-sidecar-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lifecycle of the Crewspan server sidecar: start, readiness, stop, errors. No Tauri dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
